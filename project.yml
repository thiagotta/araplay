name: AraPlay
options:
  bundleIdPrefix: com.araplay
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: YES
packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    from: 1.0.0

targets:
  AraPlay:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # XcodeGen has no `resources:` key — assets belong in `sources:`, where it
      # recognises .xcassets and puts them in the Copy Resources phase.
      - path: Resources/Assets.xcassets
    dependencies:
      - package: MPVKit
        product: MPVKit
    scheme:
      testTargets:
        - AraPlayTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.araplay.AraPlay
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
      configs:
        Release:
          # Without this, ad-hoc signing injects `get-task-allow` (the debugger
          # entitlement) into Release builds. Notarization rejects it, and a
          # distributed build has no business being debuggable.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  AraPlayTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: AraPlay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.araplay.AraPlayTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AraPlay.app/Contents/MacOS/AraPlay
        BUNDLE_LOADER: $(TEST_HOST)
